<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidor de HC - Sistema Dinâmico</title>
    <style>
        :root {
            --primary: #1e3c72;
            --primary-dark: #16305c;
            --accent: #eab308;
            --accent-light: #fde047;
            --muted: #6b7280;
            --bg-page: #1e3c72;
            --bg-card: #ffffff;
            --bg-inner: #fafafa;
            --border: #e5e5e5;
            --danger: #b03a2e;
            --ok: #2c7a4b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-page);
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .header {
            background: var(--bg-card);
            color: var(--primary);
            padding: 25px 30px;
            border-bottom: 3px solid var(--accent);
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .header p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .log-area {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-inner);
        }

        .log-area label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .log-textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            background: #fff;
            color: #333;
            transition: 0.2s;
        }

        .log-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        .btn-processar {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }

        .btn-processar:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-exemplo {
            background: var(--accent);
            color: #1a1500;
        }

        .btn-exemplo:hover {
            background: var(--accent-light);
        }

        .stats-bar {
            background: var(--bg-inner);
            padding: 14px 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }

        .stat-item {
            background: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--primary);
        }

        .stat-label {
            font-weight: 600;
            color: var(--primary);
        }

        .filtros {
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 2;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        .filter-group select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            min-width: 250px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .procuradores-grid {
            padding: 15px 20px;
            background: var(--bg-inner);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .procurador-chip {
            background: #fff;
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .procurador-chip span {
            cursor: pointer;
            color: var(--primary);
        }

        .procurador-chip span:hover {
            text-decoration: underline;
        }

        .procurador-chip button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .procurador-chip button:hover {
            background: var(--primary-dark);
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--primary);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.78rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.82rem;
        }

        tr:hover {
            background: rgba(30, 60, 114, 0.04);
        }

        .processo-num {
            font-family: 'Consolas', 'Monaco', monospace;
            font-weight: 600;
            color: var(--primary);
            white-space: nowrap;
        }

        .link-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.72rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-mp {
            background: var(--primary);
            color: white;
        }
        .btn-mp:hover { background: var(--primary-dark); }

        .btn-tj {
            background: var(--accent);
            color: #1a1500;
        }
        .btn-tj:hover { background: var(--accent-light); }

        .badge-prior {
            background: var(--danger);
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .footer {
            padding: 15px 20px;
            background: var(--bg-inner);
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
            border-top: 1px solid var(--border);
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1>Processos Distribuídos por Procurador</h1>
            <p>Cole o log da distribuição - O sistema identifica automaticamente processos e procuradores</p>
        </div>

        <div class="log-area">
            <label>Cole aqui o LOG da distribuição:</label>
            <textarea id="logInput" class="log-textarea" placeholder="Cole aqui o log da distribuição..."></textarea>
            <div>
                <button class="btn-processar" onclick="processarLog()">Processar Log</button>
                <button class="btn-processar btn-exemplo" onclick="resetarSistema()">Resetar</button>
            </div>
        </div>

        <div id="resultados" style="display: none;">
            <div class="stats-bar" id="statsBar"></div>

            <div class="procuradores-grid" id="procuradoresGrid"></div>

            <div class="filtros">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar por número do processo...">
                </div>
                <div class="filter-group">
                    <select id="procuradorFilter">
                        <option value="">Todos os procuradores</option>
                    </select>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="processosTable">
                    <thead>
                        <tr>
                            <th>Nº Processo</th>
                            <th>Tipo</th>
                            <th>Prioridade</th>
                            <th>Procurador(a)</th>
                            <th>Links</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            MP = Gestão MP | TJ = Partes/Advogados TJMG | Clique nos nomes dos procuradores para filtrar
            <br>Anna do HC - 2026
        </div>
    </div>
</div>

<script>
    let processos = [];

    function numeroParaLink(numero) {
        let limpo = numero.replace(/\./g, '').replace(/-/g, '').replace(/\//g, '');
        if (limpo.length > 17) limpo = limpo.substring(0, 17);
        while (limpo.length < 17) limpo = '0' + limpo;
        return limpo;
    }

    function gerarLinkMP(numero) {
        let numLimpo = numeroParaLink(numero);
        return `https://aplicacao.mpmg.mp.br/pareceres/processoParecerPesquisar.do?numProcessoCorrente=0${numLimpo}`;
    }

    function gerarLinkTJ(numero) {
        let numLimpo = numeroParaLink(numero);
        return `https://www4.tjmg.jus.br/juridico/sf/proc_partes_advogados2.jsp?listaProcessos=${numLimpo}`;
    }

    function normalizarProcurador(nome) {
        return nome
            .toUpperCase()
            .replace(/\s*-\s*HC/g, '')
            .replace(/\s*DEPEND/g, '')
            .replace(/\s*PREVEN.*/g, '')
            .replace(/\s*DILIG.*/g, '')
            .replace(/\d{4}-\d{2}-\d{2}.*/, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function processarLog() {
        const logText = document.getElementById('logInput').value;
        if (!logText.trim()) {
            alert('Cole o log da distribuição primeiro!');
            return;
        }

        const linhas = logText.split('\n');
        processos = [];

        const regex = /(\d+\.\d+\.\d+\.\d+\.\d+-\d+\/\d+).*->\s*([A-Z\s\-]+)/i;

        for (let linha of linhas) {
            linha = linha.trim();
            if (!linha) continue;

            const match = linha.match(regex);
            if (match) {
                let numero = match[1];
                let tipo = "HABEAS CORPUS";
                let procurador = match[2];

                procurador = procurador.replace(/\s+\d{4}-\d{2}-\d{2}.*$/, '').trim();
                procurador = normalizarProcurador(procurador);

                let prioridade = tipo.toUpperCase().includes('RP') || linha.toUpperCase().includes('PRIOR:TRUE');

                processos.push({
                    numero: numero,
                    tipo: tipo,
                    prioridade: prioridade,
                    procurador: procurador
                });
            } else {
                const regexSimples = /(\d+\.\d+\.\d+\.\d+\.\d+-\d+\/\d+)\s*->\s*([A-Z\s]+(?:-?\s*HC)?)/i;
                const match2 = linha.match(regexSimples);
                if (match2) {
                    processos.push({
                        numero: match2[1],
                        tipo: "HABEAS CORPUS",
                        prioridade: false,
                        procurador: match2[2].replace(/\s+\d{4}-\d{2}-\d{2}.*$/, '').trim()
                    });
                }
            }
        }

        if (processos.length === 0) {
            alert('Nenhum processo identificado. Verifique se o log está no formato correto.\n\nFormato esperado:\n1.0000.26.XXX.X-XX/000 - TIPO -> NOME DO PROCURADOR');
            return;
        }

        document.getElementById('resultados').style.display = 'block';
        atualizarEstatisticas();
        popularFiltros();
        renderizarTabela();
    }

    function atualizarEstatisticas() {
        const totalProcessos = processos.length;
        const procuradoresUnicos = [...new Set(processos.map(p => p.procurador))];
        const totalProcuradores = procuradoresUnicos.length;
        const prioritarios = processos.filter(p => p.prioridade).length;

        let contagem = {};
        processos.forEach(p => {
            contagem[p.procurador] = (contagem[p.procurador] || 0) + 1;
        });

        let statsHtml = `
            <span class="stat-item"><span class="stat-label">Total de processos:</span> ${totalProcessos}</span>
            <span class="stat-item"><span class="stat-label">Procuradores:</span> ${totalProcuradores}</span>
            <span class="stat-item"><span class="stat-label">Prioritários:</span> ${prioritarios}</span>
            <span class="stat-item"><span class="stat-label">Data:</span> ${new Date().toLocaleDateString('pt-BR')}</span>
        `;

        let topProcurador = Object.entries(contagem).sort((a,b) => b[1] - a[1])[0];
        if (topProcurador) {
            statsHtml += `<span class="stat-item"><span class="stat-label">Mais processos:</span> ${topProcurador[0].substring(0,30)} (${topProcurador[1]})</span>`;
        }

        document.getElementById('statsBar').innerHTML = statsHtml;
    }

    function popularFiltros() {
        const procuradores = [...new Set(processos.map(p => p.procurador))].sort();

        const select = document.getElementById('procuradorFilter');
        select.innerHTML = '<option value="">Todos os procuradores</option>' +
            procuradores.map(p => `<option value="${p}">${p} (${processos.filter(pr => pr.procurador === p).length})</option>`).join('');

        const grid = document.getElementById('procuradoresGrid');

        grid.innerHTML = procuradores.map(p => {
            const qtd = processos.filter(pr => pr.procurador === p).length;
            return `
                <div class="procurador-chip">
                    <span onclick="filtrarPorProcurador('${p}')">
                        ${p.length > 30 ? p.substring(0,27)+'...' : p} (${qtd})
                    </span>
                    <button onclick="copiarProcessos('${p}')">Copiar</button>
                </div>
            `;
        }).join('');
    }

    function filtrarPorProcurador(nome) {
        const select = document.getElementById('procuradorFilter');
        select.value = nome;
        renderizarTabela();
        document.querySelector('.table-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function copiarProcessos(procurador) {
        const lista = processos
            .filter(p => p.procurador === procurador)
            .map(p => p.numero)
            .join('\n');

        navigator.clipboard.writeText(lista)
            .then(() => {
                alert(`Copiado!\n\n${lista.split('\n').length} processos de:\n${procurador}`);
            })
            .catch(() => {
                alert('Erro ao copiar');
            });
    }

    function resetarSistema() {
        if (!confirm('Deseja realmente resetar tudo?')) return;

        processos = [];
        document.getElementById('logInput').value = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('procuradorFilter').innerHTML = '<option value="">Todos</option>';
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('statsBar').innerHTML = '';
        document.getElementById('procuradoresGrid').innerHTML = '';
        document.getElementById('resultados').style.display = 'none';
    }

    function renderizarTabela() {
        const filtroTexto = document.getElementById('searchInput').value.toLowerCase();
        const filtroProcurador = document.getElementById('procuradorFilter').value;

        let filtrados = processos.filter(p => {
            let matchTexto = filtroTexto === '' || p.numero.toLowerCase().includes(filtroTexto);
            let matchProcurador = filtroProcurador === '' || p.procurador === filtroProcurador;
            return matchTexto && matchProcurador;
        });

        const tbody = document.getElementById('tableBody');

        if (filtrados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="no-results">Nenhum processo encontrado para este filtro</td></tr>';
            return;
        }

        tbody.innerHTML = filtrados.map(p => `
            <tr>
                <td class="processo-num">${p.numero}</td>
                <td>${p.tipo}</td>
                <td style="text-align:center">${p.prioridade ? '<span class="badge-prior">Prioritário</span>' : '—'}</td>
                <td><strong>${p.procurador}</strong></td>
                <td>
                    <div class="link-buttons">
                        <a href="${gerarLinkMP(p.numero)}" target="_blank" class="btn-link btn-mp" title="Abrir pareceres MP">MP</a>
                        <a href="${gerarLinkTJ(p.numero)}" target="_blank" class="btn-link btn-tj" title="Abrir partes/advogados TJ">TJ</a>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', () => renderizarTabela());
    document.getElementById('procuradorFilter').addEventListener('change', () => renderizarTabela());
</script>
</body>
</html>
