<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Verificador de Processos Duplicados</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3c72;
            --primary-dark: #16305c;
            --accent: #eab308;
            --accent-light: #fde047;
            --muted: #6b7280;
            --bg-page: #1e3c72;
            --bg-card: #ffffff;
            --bg-inner: #fafafa;
            --border: #e5e5e5;
            --danger: #b03a2e;
            --ok: #2c7a4b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-page);
            color: #333;
            padding: 24px;
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        header.header {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--accent);
            flex-wrap: wrap;
        }

        .title h2 {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .muted {
            color: var(--muted);
            font-size: 0.85rem;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            resize: vertical;
            background: #fff;
            color: #333;
            transition: 0.2s;
        }

        textarea::placeholder { color: #999; }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        .topo {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.88rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: #fff;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-ghost:hover {
            background: var(--primary);
            color: #fff;
        }

        .btn-success {
            background: var(--accent);
            color: #1a1500;
        }
        .btn-success:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #8b2a20;
        }

        .small-btn { font-size: 0.8rem; padding: 7px 12px; }

        .bloco {
            background: var(--bg-inner);
            padding: 18px;
            margin-top: 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
        }

        .bloco h3 {
            font-size: 1rem;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .bloco.duplicados {
            border-left-color: var(--danger);
        }

        .bloco.duplicados h3 {
            color: var(--danger);
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
            font-size: 0.85rem;
            background: #fff;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: #333;
            font-family: 'Consolas', 'Monaco', monospace;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }

        .info {
            margin: 14px 0;
            font-size: 0.85rem;
            background: #fff;
            padding: 12px 14px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            color: #333;
            white-space: pre-line;
            line-height: 1.6;
        }

        .copy-inline {
            background: transparent;
            border: 1px solid var(--primary);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .copy-inline:hover {
            background: var(--primary);
            color: #fff;
        }

        .hidden { display: none !important; }

        footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 0.8rem;
        }

        footer .left i { color: var(--danger); }
        footer .right i { color: var(--accent); }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        @media (max-width: 700px) {
            .wrap { padding: 20px; }
            header.header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="header">
            <div class="title">
                <h2>Verificador de Processos Duplicados</h2>
                <div class="muted">Cole o conteúdo da tela de recebimento</div>
            </div>
        </header>

        <textarea id="entrada" placeholder="Cole aqui após copiar a folha da tela de recebimento inteira (Ctrl + A)..."></textarea>

        <div class="topo">
            <button class="btn btn-primary" onclick="analisar()">Analisar</button>
            <button class="btn btn-ghost" onclick="resetForm()">Resetar</button>
            <button class="btn btn-success" onclick="copiarTodos()">Copiar todos (números)</button>
        </div>

        <div class="info" id="info"></div>

        <div class="bloco duplicados hidden" id="fixoDuplicados">
            <h3>
                Duplicados
                <button class="copy-inline" onclick="copiarDuplicados()">Copiar</button>
            </h3>
            <pre id="duplicados">Nenhum duplicado encontrado.</pre>
        </div>

        <div class="bloco">
            <h3>
                Todos os processos
                <button class="copy-inline" onclick="copiarTodos()">Copiar</button>
            </h3>
            <pre id="unicos">Nenhum processo listado ainda.</pre>
        </div>

        <div class="bloco">
            <h3>Extrair números de mensagens</h3>
            <textarea id="entradaMensagens" placeholder="Cole aqui mensagens como: Processo 10000252728456000 atualizado com sucesso!"></textarea>
            <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn btn-primary small-btn" onclick="extrairMensagens()">Extrair</button>
                <button class="btn btn-ghost small-btn" onclick="copiarMensagens()">Copiar Números</button>
            </div>
            <div class="info" id="infoMensagens"></div>
            <pre id="saidaMensagens">Nenhum número extraído ainda.</pre>
        </div>

        <footer>
            <div class="left">Anna do HC</div>
            <div class="right">v2.0</div>
        </footer>
    </div>

    <script>
        let duplicadosNumeros = [];
        let numerosExtraidos = [];

        function analisar() {
            const texto = document.getElementById("entrada").value || "";
            const regex = /\d{1,2}\.\d{4}\.\d{2}\.\d{3}\.\d{3}-\d\/\d{3}/g;
            const encontrados = texto.match(regex) || [];

            const contagem = {};
            encontrados.forEach(num => {
                contagem[num] = (contagem[num] || 0) + 1;
            });

            const unicos = Object.keys(contagem);
            duplicadosNumeros = unicos.filter(num => contagem[num] > 1);

            const total = encontrados.length;
            const duplicadosTotal = duplicadosNumeros.reduce((acc, num) => acc + (contagem[num] - 1), 0);
            const infoTexto = `Total colado: ${total}
Processos únicos: ${unicos.length}
Duplicados: ${duplicadosNumeros.length} (${duplicadosTotal} repetições)`;
            document.getElementById("info").innerText = infoTexto;

            const todos = unicos.length > 0 ? unicos.map(num => `${num} (x${contagem[num]})`).join("\n") : "Nenhum processo listado ainda.";
            document.getElementById("unicos").innerText = todos;

            if (duplicadosNumeros.length > 0) {
                const duplicadosTexto = duplicadosNumeros.map(num => `${num} (x${contagem[num]})`).join("\n");
                document.getElementById("duplicados").innerText = duplicadosTexto;
                document.getElementById("fixoDuplicados").classList.remove('hidden');
            } else {
                document.getElementById("duplicados").innerText = "Nenhum duplicado encontrado.";
                document.getElementById("fixoDuplicados").classList.add('hidden');
            }

            const infoEl = document.getElementById("info");
            if (infoEl) infoEl.scrollIntoView({behavior: 'smooth', block: 'center'});
        }

        function copiarDuplicados() {
            if (!Array.isArray(duplicadosNumeros) || duplicadosNumeros.length === 0) {
                alert("Não há duplicados para copiar.");
                return;
            }
            const limpos = duplicadosNumeros.map(n => n.replace(/\D/g, ""));
            const texto = limpos.join("\n");
            navigator.clipboard.writeText(texto).then(() => {
                alert("Duplicados copiados (apenas números)!");
            }).catch(()=>{ alert("Falha ao copiar."); });
        }

        function resetForm() {
            document.getElementById("entrada").value = "";
            document.getElementById("entradaMensagens").value = "";
            document.getElementById("info").innerText = "";
            document.getElementById("unicos").innerText = "Nenhum processo listado ainda.";
            document.getElementById("duplicados").innerText = "Nenhum duplicado encontrado.";
            document.getElementById("saidaMensagens").innerText = "Nenhum número extraído ainda.";
            document.getElementById("infoMensagens").innerText = "";
            document.getElementById("fixoDuplicados").classList.add('hidden');

            duplicadosNumeros = [];
            numerosExtraidos = [];

            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function extrairMensagens() {
            const texto = document.getElementById("entradaMensagens").value || "";
            const encontrados = texto.match(/\d{5,}/g) || [];
            numerosExtraidos = Array.from(encontrados);

            if (numerosExtraidos.length > 0) {
                document.getElementById("saidaMensagens").innerText = numerosExtraidos.join("\n");
                document.getElementById("infoMensagens").innerText = `Total de números extraídos: ${numerosExtraidos.length}`;
            } else {
                document.getElementById("saidaMensagens").innerText = "Nenhum número encontrado.";
                document.getElementById("infoMensagens").innerText = "";
            }
        }

        function copiarMensagens() {
            if (!Array.isArray(numerosExtraidos) || numerosExtraidos.length === 0) {
                alert("Nenhum número para copiar.");
                return;
            }
            navigator.clipboard.writeText(numerosExtraidos.join("\n")).then(() => {
                alert("Números copiados!");
            }).catch(()=>{ alert("Falha ao copiar."); });
        }

        function copiarTodos() {
            const texto = document.getElementById("unicos").innerText;
            if (!texto || texto.trim()==="" || texto.includes("Nenhum processo")) {
                alert("Não há processos para copiar.");
                return;
            }
            const somenteNumeros = texto.split("\n").map(linha => linha.split(" ")[0]);
            navigator.clipboard.writeText(somenteNumeros.join("\n")).then(() => {
                alert("Todos os números copiados (sem contagem)!");
            }).catch(()=>{ alert("Falha ao copiar."); });
        }
    </script>
</body>
</html>
