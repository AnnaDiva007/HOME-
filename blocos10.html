<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Separador de Processos em Blocos de 10</title>
    <link rel="stylesheet" href="estilos-blocos.css">
</head>
<body>

<div class="container">

    <header>
        <h1>Separador de Processos <span class="badge">Blocos de 10</span></h1>
        <p class="subtitulo">Cole a lista de processos e separe em blocos de 10</p>
    </header>

    <div class="card-input">
        <textarea id="entrada" placeholder="Cole aqui a lista de processos..."></textarea>

        <div class="toolbar">
            <button class="btn-principal" onclick="processar()">
                Processar
            </button>
            <div class="toolbar-right">
                <a class="btn-secundario" href="https://aplicacao.mpmg.mp.br/scpj/f/t/gedoc/atualizarpecasman" target="_blank">
                    Sincronizar peças - SCPJ
                </a>
                <div class="total-badge">
                    Total: <strong id="contador">0</strong>
                </div>
            </div>
        </div>
    </div>

    <div id="saida" class="bloco-grid"></div>

</div>

<div id="toast" class="toast">Copiado!</div>

<script>
    function processar() {
        const entrada = document.getElementById("entrada");
        const texto = entrada.value;

        const regex = /\d\.\d{4}\.\d{2}\.\d{3}\-\d\/\d{3}|\d\.\d{4}\.\d{2}\.\d{3}\.\d-\d\/\d{3}|\d\.\d{4}\.\d{2}\.\d{3}\.\d{3}\-\d\/\d{3}/g;

        let processos = texto.match(regex) || [];

        document.getElementById("contador").textContent = processos.length;

        const saida = document.getElementById("saida");
        let html = "";

        for (let i = 0; i < processos.length; i += 10) {
            const bloco = processos.slice(i, i + 10).join(";");
            const numero = Math.floor(i / 10) + 1;
            const blocoEscapado = bloco.replace(/`/g, '\\`').replace(/\$/g, '\\$');

            html += `
                <div class="bloco">
                    <div class="bloco-header">
                        <span class="bloco-titulo">Bloco ${numero}</span>
                        <button class="btn-copy" onclick="copiar('${blocoEscapado}')">
                            Copiar
                        </button>
                    </div>
                    <div class="resultado">${bloco}</div>
                </div>
            `;
        }

        saida.innerHTML = html || `<p class="vazio">Nenhum processo encontrado.</p>`;
    }

    function copiar(texto) {
        navigator.clipboard.writeText(texto).then(mostrarToast).catch(() => {
            const area = document.createElement("textarea");
            area.value = texto;
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            document.body.removeChild(area);
            mostrarToast();
        });
    }

    function mostrarToast() {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    document.getElementById("entrada").addEventListener("keydown", function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") processar();
    });
</script>

</body>
</html>
